name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            KEYSTORE_FILE="$RUNNER_TEMP/release.p12" gradle assembleRelease --no-daemon --stacktrace
            cp app/build/outputs/apk/release/app-release.apk ../POS.apk
            echo "KIND=release" >> "$GITHUB_ENV"
          else
            echo "::warning::ยังไม่ได้ตั้ง KEYSTORE_B64 / KEYSTORE_PASSWORD — สร้าง APK แบบ debug แทน"
            gradle assembleDebug --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk ../POS.apk
            echo "KIND=debug" >> "$GITHUB_ENV"
          fi
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" POS.apk \
            --title "POS Android (build ${{ github.run_number }}, $KIND)" \
            --notes "ดาวน์โหลด POS.apk แล้วเปิดติดตั้งบนมือถือ Android (อนุญาตติดตั้งจากแหล่งที่ไม่รู้จัก)" --latest
