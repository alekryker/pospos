plugins { id 'com.android.application' }

def vc = (System.getenv('VERSION_CODE') ?: '1') as int

android {
  namespace 'io.github.alekryker.pos247'
  compileSdk 34
  defaultConfig {
    applicationId 'io.github.alekryker.pos247'
    minSdk 21
    targetSdk 34
    versionCode vc
    versionName "1.0.${vc}"
  }
  signingConfigs {
    release {
      storeFile file(System.getenv('KEYSTORE_FILE') ?: 'missing.p12')
      storePassword System.getenv('KEYSTORE_PASSWORD')
      keyAlias 'pos'
      keyPassword System.getenv('KEYSTORE_PASSWORD')
      storeType 'pkcs12'
    }
  }
  buildTypes {
    release { minifyEnabled false; signingConfig signingConfigs.release }
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
  implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
