<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f4ef">
<title>สั่งอาหาร · SLAY</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --raise:#efede7; --ink:#15171a; --sub:#6b6f76; --mute:#a7aab0;
  --line:rgba(21,23,26,.08); --line2:rgba(21,23,26,.14);
  --brand:#0f7a5a; --brand2:#12936c; --brandSoft:rgba(15,122,90,.10); --brandInk:#fff;
  --hot:#c2410c; --hotSoft:#fff1e8; --danger:#d93a4b;
  --shadow:0 1px 2px rgba(21,23,26,.04),0 10px 26px rgba(21,23,26,.07);
  --safeB:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{zoom:.92}
body{font-family:'Anuphan',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.4;min-height:100vh;padding-bottom:calc(110px + var(--safeB))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.fi{display:inline-flex;line-height:1}.fi::before{line-height:1}
.wrap{max-width:720px;margin:0 auto}

/* header */
.head{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:14px 16px 10px;border-bottom:1px solid transparent;transition:border-color .2s}
.head.scrolled{border-bottom-color:var(--line)}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:50px;height:50px;border-radius:15px;background:#dc1f14;display:grid;place-items:center;overflow:hidden;flex:0 0 auto;box-shadow:var(--shadow)}
.logo img{width:88%;height:auto}
.bt{flex:1;min-width:0}.bt b{display:block;font-size:20px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt small{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
.tbl{display:inline-flex;align-items:center;gap:4px;background:var(--brandSoft);color:var(--brand);font-weight:700;padding:1px 8px;border-radius:999px}
.lang{display:flex;padding:4px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.lang button{min-width:40px;height:32px;border-radius:999px;font-size:13px;font-weight:700;color:var(--sub)}
.lang button.on{background:var(--ink);color:#fff}
.search{position:relative;margin-top:12px}
.search i{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--mute);font-size:17px}
.search input{width:100%;height:48px;border-radius:16px;border:1px solid var(--line);background:var(--card);padding:0 16px 0 44px;font:inherit;font-size:15px;outline:none}
.search input:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brandSoft)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line2);background:var(--card);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip small{color:var(--mute);font-weight:600;font-size:12px}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}.chip.on small{color:rgba(255,255,255,.75)}

/* sections */
main{padding:6px 16px 0}
.sec{margin-top:18px}
.sech{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.sech b{font-size:17px;font-weight:700;display:inline-flex;align-items:center;gap:7px}
.sech b i{color:var(--hot)}.sech b i.g{color:var(--brand)}
.sech small{color:var(--sub);font-size:12.5px}
.hscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none}.hscroll::-webkit-scrollbar{display:none}
.hscroll .card{flex:0 0 46%;max-width:210px;scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.hscroll .card{flex-basis:30%}}

/* card */
.card{position:relative;background:var(--card);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);border:2px solid transparent;display:flex;flex-direction:column;transition:border-color .15s}
.card.in{border-color:var(--brand)}
.ph{position:relative;aspect-ratio:4/3;background:#fff;display:grid;place-items:center;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph .ini{font-size:30px;font-weight:700;color:var(--brand);opacity:.5}
.badges{position:absolute;top:8px;left:8px;display:flex;gap:5px;flex-wrap:wrap;z-index:1}
.bdg{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:700;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.bdg.hot{background:var(--hot)}.bdg.rec{background:var(--brand)}
.sold{position:absolute;inset:0;background:rgba(255,255,255,.72);display:grid;place-items:center;font-weight:700;color:var(--danger);font-size:15px;z-index:1}
.cb{padding:10px 12px 12px;display:flex;flex-direction:column;flex:1;gap:6px}
.nm{font-size:14.5px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;gap:6px}
.pr{font-size:17px;font-weight:700;color:var(--brand)}
.add{width:42px;height:42px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:18px;box-shadow:0 6px 14px rgba(15,122,90,.3);flex:0 0 auto}
.add:active{transform:scale(.92)}
.step{display:flex;align-items:center;background:var(--brandSoft);border-radius:999px;padding:3px}
.step button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:15px;color:var(--brand)}
.step button.p{background:var(--brand);color:#fff}
.step span{min-width:24px;text-align:center;font-weight:700;color:var(--brand)}
.empty{text-align:center;color:var(--sub);padding:50px 10px}.empty i{font-size:40px;color:var(--mute);display:block;margin-bottom:10px}

/* cart bar + sheet */
.bar{position:fixed;left:16px;right:16px;bottom:calc(16px + var(--safeB));z-index:30;max-width:688px;margin:0 auto;height:62px;border-radius:20px;background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;padding:0 10px 0 16px;box-shadow:0 16px 40px rgba(0,0,0,.25);transform:translateY(140%);transition:transform .25s}
.bar.on{transform:none}
.bar .n{width:36px;height:36px;border-radius:12px;background:var(--brand);display:grid;place-items:center;font-weight:700}
.bar .t{flex:1}.bar .t b{display:block;font-size:16px}.bar .t small{opacity:.7;font-size:12px}
.bar .go{height:44px;padding:0 16px;border-radius:14px;background:#fff;color:var(--ink);font-weight:700}
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s}.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:720px;margin:0 auto;max-height:90vh;display:flex;flex-direction:column;background:var(--card);border-radius:26px 26px 0 0;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.sh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px}.sh b{font-size:19px}
.x{width:38px;height:38px;border-radius:12px;background:var(--raise);display:grid;place-items:center;font-size:18px}
.lines{overflow-y:auto;padding:0 18px}
.ln{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.ln .th{width:52px;height:52px;border-radius:14px;background:#fff;border:1px solid var(--line);overflow:hidden;flex:0 0 auto}
.ln .th img{width:100%;height:100%;object-fit:cover}
.ln .i{flex:1;min-width:0}.ln .i b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ln .i small{color:var(--sub)}
.sf{padding:12px 18px calc(16px + var(--safeB));border-top:1px solid var(--line)}
.field{margin-bottom:10px}.field label{display:block;font-size:13px;font-weight:600;color:var(--sub);margin-bottom:6px}
.field input,.field textarea{width:100%;border:1px solid var(--line2);border-radius:14px;background:var(--bg);padding:11px 13px;font:inherit;font-size:15px;outline:none;resize:none}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 12px}.tot b{font-size:24px;color:var(--brand)}
.cta{width:100%;height:54px;border-radius:16px;background:var(--brand);color:#fff;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.cta:disabled{opacity:.5}
.hint{font-size:12.5px;color:var(--sub);text-align:center;margin-top:10px}

/* done */
.done{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
.done.on{display:flex}
.done .ok{width:92px;height:92px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:44px;margin-bottom:18px;box-shadow:0 16px 40px rgba(15,122,90,.35)}
.done h2{font-size:24px;margin-bottom:6px}.done p{color:var(--sub);margin-bottom:4px}
.done .no{font-size:42px;font-weight:700;color:var(--brand);margin:14px 0}
.done .cta{max-width:320px;margin-top:20px}
.toast{position:fixed;top:16px;left:50%;transform:translate(-50%,-30px);opacity:0;z-index:80;background:var(--ink);color:#fff;padding:11px 18px;border-radius:14px;font-size:14px;font-weight:600;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}.toast.err{background:var(--danger)}
.load{text-align:center;padding:80px 0;color:var(--sub)}
.credit{text-align:center;color:var(--mute);font-size:11px;padding:24px 0 6px}.credit a{color:inherit}
</style>
</head>
<body>
<div class="wrap">
  <header class="head" id="head">
    <div class="brand">
      <div class="logo"><img src="icons/logo-wide.png" alt="SLAY"></div>
      <div class="bt"><b id="shop">SLAY</b><small><span id="sub">สั่งออเดอร์ผ่าน QR</span><span class="tbl" id="tbl" hidden><i class="fi fi-rr-restaurant"></i><span></span></span></small></div>
      <div class="lang"><button data-lang="th" class="on">TH</button><button data-lang="en">EN</button></div>
    </div>
    <div class="search"><i class="fi fi-rr-search"></i><input id="q" type="search" autocomplete="off"></div>
    <div class="chips" id="chips"></div>
  </header>
  <main id="main"><div class="load" id="load">กำลังโหลดเมนู...</div></main>
  <div class="credit">Icons: <a href="https://www.flaticon.com/uicons" target="_blank" rel="noopener">Uicons by Flaticon</a></div>
</div>

<button class="bar" id="bar"><span class="n" id="bn">0</span><span class="t"><b id="bt">฿0</b><small id="bs"></small></span><span class="go" id="bgo"></span></button>
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" aria-modal="true" role="dialog">
  <div class="sh"><b id="cartTitle"></b><button class="x" id="closeCart" aria-label="close"><i class="fi fi-rr-cross-small"></i></button></div>
  <div class="lines" id="lines"></div>
  <div class="sf">
    <div class="field" id="tblField" hidden><label id="tblLabel"></label><input id="tblInput" inputmode="numeric" maxlength="10"></div>
    <div class="field"><label id="noteLabel"></label><textarea id="note" rows="2" maxlength="200"></textarea></div>
    <div class="tot"><span id="totLabel"></span><b id="tot">฿0</b></div>
    <button class="cta" id="send"><i class="fi fi-rr-check"></i><span id="sendLabel"></span></button>
    <div class="hint" id="payHint"></div>
  </div>
</section>
<div class="done" id="done">
  <div class="ok"><i class="fi fi-rr-check"></i></div>
  <h2 id="doneTitle"></h2><p id="doneSub"></p><div class="no" id="doneNo"></div><p id="donePay"></p>
  <button class="cta" id="more"><i class="fi fi-rr-plus-small"></i><span id="moreLabel"></span></button>
</div>
<div class="toast" id="toast"></div>

<script>
const SB_URL='https://armhgexnmpgqwfpmhfxx.supabase.co',SB_KEY='sb_publishable_FiGOYIx9hAzdLZ-0DgM1lw_7vziMn5p';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'฿'+Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2});
const T={
  th:{sub:'สั่งออเดอร์ผ่าน QR',table:'โต๊ะ',search:'ค้นหาเมนู...',rec:'แนะนำ',all:'ทั้งหมด',other:'อื่นๆ',recSec:'เมนูแนะนำ',recHint:'คัดมาให้แล้ว',best:'เมนูขายดี',bestHint:'สั่งบ่อยที่สุด',hot:'ขายดี',star:'แนะนำ',soldout:'หมดชั่วคราว',
    items:n=>n+' รายการ',view:'ดูตะกร้า',cart:'ตะกร้าของคุณ',note:'หมายเหตุถึงร้าน (ถ้ามี)',notePh:'เช่น ไม่ใส่น้ำแข็ง',total:'รวม',send:'ยืนยันสั่งอาหาร',pay:'สั่งแล้วชำระเงินที่เคาน์เตอร์',
    tblAsk:'หมายเลขโต๊ะ',tblNeed:'กรุณาใส่หมายเลขโต๊ะ',empty:'ไม่พบเมนู',sending:'กำลังส่งออเดอร์...',doneT:'ส่งออเดอร์แล้ว',doneS:'ร้านได้รับออเดอร์ของคุณแล้ว',orderNo:'เลขออเดอร์',donePay:'กรุณาชำระเงินที่เคาน์เตอร์',more:'สั่งเพิ่ม',err:'ส่งไม่สำเร็จ',loadErr:'โหลดเมนูไม่ได้ ลองใหม่อีกครั้ง',rm:'ลบ'},
  en:{sub:'Order via QR',table:'Table',search:'Search menu...',rec:'Recommended',all:'All',other:'Others',recSec:'Recommended',recHint:'Our picks',best:'Best sellers',bestHint:'Most ordered',hot:'Best seller',star:'Pick',soldout:'Sold out',
    items:n=>n+(n>1?' items':' item'),view:'View cart',cart:'Your cart',note:'Note to the shop (optional)',notePh:'e.g. no ice',total:'Total',send:'Place order',pay:'Pay at the counter after ordering',
    tblAsk:'Table number',tblNeed:'Please enter your table number',empty:'No items found',sending:'Sending order...',doneT:'Order sent',doneS:'The shop has received your order',orderNo:'Order no.',donePay:'Please pay at the counter',more:'Order more',err:'Could not send',loadErr:'Could not load the menu. Please try again.',rm:'Remove'}
};
const qs=new URLSearchParams(location.search);
let TABLE=(qs.get('t')||qs.get('table')||'').trim().slice(0,10);
let LANG=localStorage.getItem('qr:lang')||((navigator.language||'th').startsWith('th')?'th':'en');
let MENU=[],SHOP='',CHIP='rec',Q='';
const CK='qr:cart:'+(TABLE||'-');
let CART={};try{CART=JSON.parse(localStorage.getItem(CK)||'{}')||{}}catch(e){}
const t=k=>T[LANG][k];
const nameOf=p=>LANG==='en'&&p.name_en?p.name_en:p.name;
const catOf=p=>p.category||t('other');
const byId=id=>MENU.find(p=>p.id===id);
function save(){try{localStorage.setItem(CK,JSON.stringify(CART))}catch(e){}}
function toast(m,err){const el=$('toast');el.textContent=m;el.className='toast on'+(err?' err':'');clearTimeout(el._t);el._t=setTimeout(()=>el.className='toast',2400)}
async function rpc(fn,body){const r=await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json','Content-Profile':'pos','Accept-Profile':'pos'},body:JSON.stringify(body||{})});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.message||('HTTP '+r.status));return j}

function card(p){const q=CART[p.id]||0;
  return `<article class="card ${q?'in':''}" data-id="${esc(p.id)}">
    <div class="ph">${p.image?`<img loading="lazy" src="${esc(p.image)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`:''}<span class="ini">${esc(nameOf(p).slice(0,2))}</span>
      <div class="badges">${p.best?`<span class="bdg hot"><i class="fi fi-rr-flame"></i>${t('hot')}</span>`:''}${p.featured?`<span class="bdg rec"><i class="fi fi-rr-star"></i>${t('star')}</span>`:''}</div>
      ${p.soldout?`<div class="sold">${t('soldout')}</div>`:''}</div>
    <div class="cb"><div class="nm">${esc(nameOf(p))}</div><div class="row"><span class="pr">${money(p.price)}</span>
      ${p.soldout?'':q?`<div class="step"><button data-dec="${esc(p.id)}" aria-label="-"><i class="fi fi-rr-minus-small"></i></button><span>${q}</span><button class="p" data-inc="${esc(p.id)}" aria-label="+"><i class="fi fi-rr-plus-small"></i></button></div>`
        :`<button class="add" data-inc="${esc(p.id)}" aria-label="+"><i class="fi fi-rr-plus"></i></button>`}</div></div></article>`}

function cats(){const m=new Map();MENU.forEach(p=>m.set(catOf(p),(m.get(catOf(p))||0)+1));return [...m.entries()]}
function renderChips(){$('chips').innerHTML=`<button class="chip ${CHIP==='rec'?'on':''}" data-chip="rec">${t('rec')}</button>`+
  cats().map(([c,n])=>`<button class="chip ${CHIP===c?'on':''}" data-chip="${esc(c)}">${esc(c)} <small>${n}</small></button>`).join('')}
function sec(title,icon,hint,items,h){if(!items.length)return'';return `<section class="sec"><div class="sech"><b><i class="fi fi-rr-${icon} ${icon==='star'?'g':''}"></i>${title}</b><small>${hint||''}</small></div>
  <div class="${h?'hscroll':'grid'}">${items.map(card).join('')}</div></section>`}
function render(){
  const q=Q.trim().toLowerCase();let html='';
  if(q){const l=MENU.filter(p=>(p.name+' '+(p.name_en||'')+' '+p.category).toLowerCase().includes(q));html=l.length?sec(t('all'),'search','',l,false):`<div class="empty"><i class="fi fi-rr-search"></i>${t('empty')}</div>`}
  else if(CHIP==='rec'){
    html+=sec(t('recSec'),'star',t('recHint'),MENU.filter(p=>p.featured),true);
    html+=sec(t('best'),'flame',t('bestHint'),MENU.filter(p=>p.best),true);
    cats().forEach(([c])=>{html+=sec(esc(c),'utensils','',MENU.filter(p=>catOf(p)===c),false)});
  } else html=sec(esc(CHIP),'utensils','',MENU.filter(p=>catOf(p)===CHIP),false)||`<div class="empty">${t('empty')}</div>`;
  $('main').innerHTML=html;renderBar()}
function count(){return Object.values(CART).reduce((a,b)=>a+b,0)}
function total(){return Object.entries(CART).reduce((a,[id,q])=>a+(byId(id)?.price||0)*q,0)}
function renderBar(){const n=count();$('bar').classList.toggle('on',n>0&&!$('sheet').classList.contains('on'));$('bn').textContent=n;$('bt').textContent=money(total());$('bs').textContent=t('items')(Object.keys(CART).length)}
function setQty(id,d){const p=byId(id);if(!p||p.soldout)return;const q=Math.max(0,Math.min(50,(CART[id]||0)+d));if(q)CART[id]=q;else delete CART[id];save();
  document.querySelectorAll(`.card[data-id="${CSS.escape(id)}"]`).forEach(el=>{el.outerHTML=card(p)});renderBar();if($('sheet').classList.contains('on'))renderLines()}
function renderLines(){const ids=Object.keys(CART).filter(byId);
  $('lines').innerHTML=ids.length?ids.map(id=>{const p=byId(id),q=CART[id];return `<div class="ln"><div class="th">${p.image?`<img src="${esc(p.image)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`:''}</div>
    <div class="i"><b>${esc(nameOf(p))}</b><small>${money(p.price)} × ${q} = ${money(p.price*q)}</small></div>
    <div class="step"><button data-dec="${esc(id)}"><i class="fi fi-rr-${q>1?'minus-small':'trash'}"></i></button><span>${q}</span><button class="p" data-inc="${esc(id)}"><i class="fi fi-rr-plus-small"></i></button></div></div>`}).join(''):`<div class="empty">${t('empty')}</div>`;
  $('tot').textContent=money(total());$('send').disabled=!ids.length}
function openCart(){renderLines();$('sheet').classList.add('on');$('scrim').classList.add('on');renderBar()}
function closeCart(){$('sheet').classList.remove('on');$('scrim').classList.remove('on');renderBar()}
function applyLang(){document.documentElement.lang=LANG;document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('on',b.dataset.lang===LANG));
  $('sub').textContent=t('sub');$('q').placeholder=t('search');$('bgo').textContent=t('view');$('cartTitle').textContent=t('cart');$('noteLabel').textContent=t('note');$('note').placeholder=t('notePh');
  $('totLabel').textContent=t('total');$('sendLabel').textContent=t('send');$('payHint').textContent=t('pay');$('tblLabel').textContent=t('tblAsk');
  $('doneTitle').textContent=t('doneT');$('doneSub').textContent=t('doneS');$('donePay').textContent=t('donePay');$('moreLabel').textContent=t('more');
  const tb=$('tbl');tb.hidden=!TABLE;tb.lastElementChild.textContent=t('table')+' '+TABLE;$('tblField').hidden=!!TABLE;
  if(MENU.length){renderChips();render()}}
async function send(){
  if(!TABLE){const v=$('tblInput').value.trim();if(!v){toast(t('tblNeed'),true);$('tblInput').focus();return}TABLE=v.slice(0,10)}
  const items=Object.entries(CART).filter(([id])=>byId(id)).map(([id,qty])=>({id,qty}));if(!items.length)return;
  const b=$('send');b.disabled=true;$('sendLabel').textContent=t('sending');
  try{const r=await rpc('place_order',{p_table:TABLE,p_items:items,p_note:$('note').value.trim(),p_lang:LANG});
    CART={};save();$('note').value='';closeCart();render();$('doneNo').textContent='#'+r.id;$('done').classList.add('on')}
  catch(e){toast(t('err')+': '+e.message,true)}finally{b.disabled=false;$('sendLabel').textContent=t('send')}}

document.addEventListener('click',e=>{const el=e.target;
  const inc=el.closest('[data-inc]');if(inc){setQty(inc.dataset.inc,1);return}
  const dec=el.closest('[data-dec]');if(dec){setQty(dec.dataset.dec,-1);return}
  const ch=el.closest('[data-chip]');if(ch){CHIP=ch.dataset.chip;Q='';$('q').value='';renderChips();render();window.scrollTo({top:0,behavior:'smooth'});return}
  const lg=el.closest('[data-lang]');if(lg){LANG=lg.dataset.lang;try{localStorage.setItem('qr:lang',LANG)}catch(_){}applyLang();return}});
$('bar').onclick=openCart;$('scrim').onclick=closeCart;$('closeCart').onclick=closeCart;$('send').onclick=send;
$('more').onclick=()=>{$('done').classList.remove('on');window.scrollTo(0,0)};
$('q').addEventListener('input',e=>{Q=e.target.value;render()});
addEventListener('scroll',()=>$('head').classList.toggle('scrolled',scrollY>4),{passive:true});

(async()=>{applyLang();
  try{const d=await rpc('public_menu');SHOP=d.shop||'SLAY';MENU=(d.products||[]).map(p=>({...p,price:Number(p.price)||0}));
    $('shop').textContent=SHOP;document.title=(LANG==='en'?'Order · ':'สั่งอาหาร · ')+SHOP;
    Object.keys(CART).forEach(id=>{if(!byId(id))delete CART[id]});renderChips();render()}
  catch(e){$('main').innerHTML=`<div class="empty"><i class="fi fi-rr-time-past"></i>${t('loadErr')}<br><br><button class="chip on" onclick="location.reload()">↻</button></div>`}})();
</script>
</body>
</html>
